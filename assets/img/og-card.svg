<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-monospace, 'DejaVu Sans Mono', 'Courier New', monospace">
  <defs>
    <radialGradient id="glowA" cx="20%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#79f2ff" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#79f2ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="90%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#9aff79" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#9aff79" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79f2ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9aff79" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b1020" />
  <rect width="1200" height="630" fill="url(#glowA)" />
  <rect width="1200" height="630" fill="url(#glowB)" />

  <!-- terminal chrome -->
  <circle cx="74" cy="72" r="9" fill="#9aff79" opacity="0.9" />
  <circle cx="104" cy="72" r="9" fill="#ffd166" opacity="0.9" />
  <circle cx="134" cy="72" r="9" fill="#ff6b6b" opacity="0.9" />
  <text x="166" y="79" font-size="24" fill="#ffffff" opacity="0.72">teo@portfolio</text>

  <line x1="74" y1="108" x2="1126" y2="108" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1" />

  <!-- name -->
  <text x="74" y="212" font-size="68" font-weight="700" fill="#ffffff">Theodoros Mangas</text>

  <!-- positioning line -->
  <text x="74" y="286" font-size="34" fill="#79f2ff">Licensed surveyor turned Python/Django engineer</text>

  <!-- differentiator -->
  <text x="74" y="352" font-size="27" fill="#ffffff" opacity="0.80">I build the tooling for the industry I came from:</text>
  <text x="74" y="394" font-size="27" fill="#ffffff" opacity="0.80">geospatial pipelines, validation-heavy workflows,</text>
  <text x="74" y="436" font-size="27" fill="#ffffff" opacity="0.80">and web apps that hold up in the field.</text>

  <line x1="74" y1="486" x2="620" y2="486" stroke="url(#rule)" stroke-width="2" />

  <!-- tech tags -->
  <g font-size="22">
    <rect x="74" y="514" width="104" height="42" rx="21" fill="#9aff79" fill-opacity="0.08" stroke="#9aff79" stroke-opacity="0.25" />
    <text x="126" y="541" fill="#ffffff" opacity="0.88" text-anchor="middle">Python</text>

    <rect x="192" y="514" width="104" height="42" rx="21" fill="#9aff79" fill-opacity="0.08" stroke="#9aff79" stroke-opacity="0.25" />
    <text x="244" y="541" fill="#ffffff" opacity="0.88" text-anchor="middle">Django</text>

    <rect x="310" y="514" width="150" height="42" rx="21" fill="#9aff79" fill-opacity="0.08" stroke="#9aff79" stroke-opacity="0.25" />
    <text x="385" y="541" fill="#ffffff" opacity="0.88" text-anchor="middle">PostGIS</text>

    <rect x="474" y="514" width="130" height="42" rx="21" fill="#9aff79" fill-opacity="0.08" stroke="#9aff79" stroke-opacity="0.25" />
    <text x="539" y="541" fill="#ffffff" opacity="0.88" text-anchor="middle">Leaflet</text>

    <rect x="618" y="514" width="180" height="42" rx="21" fill="#9aff79" fill-opacity="0.08" stroke="#9aff79" stroke-opacity="0.25" />
    <text x="708" y="541" fill="#ffffff" opacity="0.88" text-anchor="middle">DXF/KML/KMZ</text>
  </g>

  <!-- prompt accent -->
  <text x="1126" y="541" font-size="30" fill="#9aff79" text-anchor="end">~$ <tspan fill="#ffffff" opacity="0.75">_</tspan></text>
</svg>
